# CI Workers Builds project name (must match Cloudflare Workers Builds)
name = "thefinals-hacks--org"
compatibility_date = "2026-01-01"
main = "src/worker.ts"

# Attach apex + www to this Worker (Cloudflare creates/updates DNS + SSL)
[[routes]]
pattern = "thefinalshacks.org"
custom_domain = true

[[routes]]
pattern = "www.thefinalshacks.org"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Run Worker first so www/http → https://thefinalshacks.org 301s always apply
run_worker_first = true
